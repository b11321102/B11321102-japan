    <title>東京探索 - 澀谷區</title>

<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>澀谷區 Shibuya</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            澀谷區是日本年輕潮流文化與時尚的發源地，擁有世界聞名的十字路口與最新的高空展望設施，從早到晚都充滿能量。
        </p>

        <!-- 唯一重點景點：SHIBUYA SKY -->
        <div class="spot-card">
            <img src="IMAGE/涉一.jpg" alt="SHIBUYA SKY">
            <div class="spot-text">
                <h3>SHIBUYA SKY（澀谷天空）</h3>
                <p>位於澀谷最高大樓 Shibuya Scramble Square 頂樓的 360 度露天展望台，高度約 229 公尺，可以無死角俯瞰澀谷十字路口、東京鐵塔與富士山美景。</p>
            </div>
        </div>

        <!-- 旅遊照片紀錄區（全放照片） -->
        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>

                <img src="IMAGE/涉二.jpg" alt="澀谷區照片1">
