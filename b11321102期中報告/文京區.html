<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>東京探索 - 文京區</title>
</head>
<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>文京區 Bunkyo</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            文京區位於東京23區中央偏北，聚集了東京大學等多所知名學府與日式庭園，是充滿書香氣息與寧靜氛圍的文教區。
        </p>


        <div class="spot-card">
            <img src="IMAGE/文一一.webp" alt="東京巨蛋">
            <div class="spot-text">
                <h3>東京巨蛋城</h3>
                <p>日本第一座巨蛋型球場，也是舉辦大型演唱會與棒球賽事的聖地，周邊結合了遊樂園與購物中心，非常熱鬧。</p>
            </div>
        </div>


        <div class="spot-card">
            <img src="IMAGE/文二.webp" alt="東京大學赤門">
            <div class="spot-text">
                <h3>東京大學（赤門與安田講堂）</h3>
                <p>日本最高學府，校園內保留許多歷史悠久的紅磚建築與銀杏大道，著名的「赤門」與「安田講堂」是必拍地標。</p>
            </div>
        </div>

    
    </main>

</body>
</html>
