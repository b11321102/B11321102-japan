<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>東京探索 - 港區</title>
</head>
<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>港區 Minato</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            港區位於東京23區東南部並緊鄰東京灣，除了有經典地標東京鐵塔外，還能搭乘水上巴士前往充滿海風與娛樂設施的台場地區。
        </p>

        <!-- 景點 1：搭船前往台場 -->
        <div class="spot-card">
            <img src="IMAGE/東京的船.jpg" alt="東京灣水上巴士">
            <div class="spot-text">
                <h3>東京灣水上巴士（前往台場）</h3>
                <p>搭乘水上巴士沿著隅田川與東京灣航行前往台場，沿途可以從海面上欣賞彩虹大橋與東京灣岸的壯闊高樓景色。</p>
            </div>
        </div>

        <!-- 景點 2：台場獨角獸鋼彈 -->
        <div class="spot-card">
            <img src="IMAGE/鋼彈.jpg" alt="台場獨角獸鋼彈">
            <div class="spot-text">
                <h3>台場購物廣場（實物大獨角獸鋼彈立像）</h3>
                <p>矗立在 DiverCity Tokyo Plaza 廣場前的 1:1 巨大獨角獸鋼彈，白天氣勢十足，定時還會有帥氣的變身與聲光燈光秀。</p>
            </div>
        </div>

        <!-- 景點 3：東京鐵塔 -->
        <div class="spot-card">
            <img src="IMAGE/鐵塔.jpg" alt="東京鐵塔">
            <div class="spot-text">
                <h3>東京鐵塔</h3>
                <p>東京最具代表性的紅白色經典地標，無論白天或夜晚點燈後都非常迷人，是來到港區不可錯過的風景。</p>
            </div>
        </div>

        <!-- 旅遊照片紀錄區 -->
        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>
            <div class="photo-grid">
                <img src="IMAGE/港一.jpg" alt="港區照片1">
                <img src="IMAGE/港二.jpg" alt="港區照片2">
                <img src="IMAGE/港三.jpg" alt="港區照片3">
                <img src="IMAGE/港四.jpg" alt="港區照片4">
                <img src="IMAGE/港五.jpg" alt="港區照片5">
                <img src="IMAGE/港六.jpg" alt="港區照片6">
            </div>
        </section>
    </main>

</body>
</html>
