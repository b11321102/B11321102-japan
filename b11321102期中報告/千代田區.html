<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>東京探索 - 千代田區</title>
</head>
<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>千代田區 Chiyoda</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            千代田區位於東京23區正中心，是日本的政治與經濟中樞，同時融合了莊嚴的皇居綠意與繁華的秋葉原動漫文化。
        </p>

        <!-- 景點 1 -->
        <div class="spot-card">
            <img src="IMAGE/皇居.jpg" alt="皇居">
            <div class="spot-text">
                <h3>皇居（二重橋）</h3>
                <p>日本天皇的居住地，周圍被護城河與茂密綠樹環繞，著名的「二重橋」是遊客必拍的經典地標。</p>
            </div>
        </div>

        <!-- 景點 2 -->
        <div class="spot-card">
            <img src="IMAGE/秋.jpg" alt="秋葉原">
            <div class="spot-text">
                <h3>秋葉原電器街</h3>
                <p>世界知名的動漫、電玩與電子產品聖地，街道兩旁林立著大型電器行、模型店與女僕咖啡廳。</p>
            </div>
        </div>

        <!-- 景點 3 -->
        <div class="spot-card">
            <img src="IMAGE/東京車站.jpg" alt="東京車站">
            <div class="spot-text">
                <h3>東京車站（丸之內站舍）</h3>
                <p>擁有百年歷史的紅磚復古建築，是東京最重要的交通樞紐，夜晚點燈後更是充滿浪漫氛圍。</p>
            </div>
        </div>
        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>
            <div class="photo-grid">
                <img src="IMAGE/千一.jpg" alt="千代田照片1">
                <img src="IMAGE/千二.jpg" alt="千代田照片2">
                <img src="IMAGE/千三.jpg" alt="千代田照片3">
                <img src="IMAGE/千四.jpg" alt="千代田照片4">
                <img src="IMAGE/千五.jpg" alt="千代田照片5">
            </div>
        </section>
    </main>

</body>
</html>
