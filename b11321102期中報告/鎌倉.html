<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>鎌倉 Kamakura</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            鎌倉位於神奈川縣沿海地區，距離東京約一小時車程。這裡不僅擁有豐富的武家古都歷史與神社寺院，還能搭乘復古的江之電沿著湘南海岸線漫遊，充滿濃厚的夏日青春氣息。
        </p>

        <!-- 景點 1 -->
        <div class="spot-card">
            <img src="IMAGE/平交道.jpg" alt="鎌倉高校前平交道">
            <div class="spot-text">
                <h3>鎌倉高校前平交道</h3>
                <p>因經典動漫《灌籃高手》片頭曲而聞名的海邊平交道，綠色的江之電電車駛過平交道時，背景就是閃耀的湘南海岸與藍天，是鎌倉最熱門的打卡地標。</p>
            </div>
        </div>

        <!-- 景點 2 -->
        <div class="spot-card">
            <img src="IMAGE/江之島.jpg" alt="江之島">
            <div class="spot-text">
                <h3>江之島</h3>
                <p>搭乘江之電即可抵達的沿海小島，島上有江島神社、展望燈塔與海蝕洞「岩屋」，沿途還能品嚐當地著名的吻仔魚丼與現壓章魚仙貝。</p>
            </div>
        </div>



        <!-- 旅遊照片紀錄區 -->
        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>
            <div class="photo-grid">
                <img src="IMAGE/鎌倉一.jpg" alt="鎌倉照片1">
                <img src="IMAGE/鎌倉二.jpg" alt="鎌倉照片2">
                <img src="IMAGE/鎌倉三.jpg" alt="鎌倉照片3">
