<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>東京探索 - 新宿區</title>
</head>
<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>新宿區 Shinjuku</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            新宿區是東京最繁華的商業與娛樂中心之一，擁有世界最繁忙的交通樞紐，從摩天大樓林立的西口到不夜城歌舞伎町，展現了東京充滿活力的一面。
        </p>

        <!-- 景點 1 -->
        <div class="spot-card">
            <img src="IMAGE/新一.webp" alt="新宿御苑">
            <div class="spot-text">
                <h3>新宿御苑</h3>
                <p>位於繁華市中心的大型庭園，融合了日式庭園、英式風景庭園與法式幾何庭園，春天賞櫻與秋天賞楓都非常迷人。</p>
            </div>
        </div>

        <!-- 景點 2 -->
        <div class="spot-card">
            <img src="IMAGE/新二.webp" alt="歌舞伎町">
            <div class="spot-text">
                <h3>歌舞伎町</h3>
                <p>日本最著名的不夜城娛樂區，霓虹燈招牌與大廈上的哥吉拉頭像極具特色，聚集了無數居酒屋、餐廳與商店。</p>
            </div>
        </div>

        <!-- 旅遊照片紀錄區 -->
        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>
            <div class="photo-grid">
                <img src="IMAGE/新三.jpg" alt="新宿區照片1">
                <img src="IMAGE/新四.jpg" alt="新宿區照片2">
                <img src="IMAGE/新五.jpg" alt="新宿區照片3">
            </div>
        </section>
    </main>

</body>
</html>
