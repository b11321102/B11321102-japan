<body class="subpage">

    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>台東區 Taito</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            台東區位於東京23區東部，保留了濃厚的下町風情與文化氣息，有著名的淺草寺與上野公園。
        </p>

        <!-- 景點 1 -->
        <div class="spot-card">
            <img src="IMAGE/20260823_133159.jpg" alt="淺草寺">
            <div class="spot-text">
                <h3>淺草寺（雷門）</h3>
                <p>東京都內歷史最悠久的寺院，巨大的紅色燈籠「雷門」與仲見世通商店街是必訪地標，充滿傳統江戶風情。</p>
            </div>
        </div>

        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>
            <div class="photo-grid">
                <img src="IMAGE/台一.jpg" alt="">
                <img src="IMAGE/台二.jpg" alt="">
                <img src="IMAGE/台三.jpg" alt="">
                <img src="IMAGE/台四.jpg" alt="">
                <img src="IMAGE/台五.jpg" alt="">
                <img src="IMAGE/台六.jpg" alt="">
            </div>
        </section>
    </main>
