<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>東京近郊探索 - 富士山</title>
</head>
<body class="subpage">

    <!-- 頂部標題與返回按鈕 -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← 返回地圖</a>
        <h1>富士山 Mt. Fuji</h1>
    </header>

    <main class="container">
        <!-- 區域簡介 -->
        <p class="intro">
            富士山橫跨山梨縣與靜岡縣，是日本最高峰與最具代表性的精神象徵。從東京出發搭乘高速巴士或特急電車約兩小時即可抵達河口湖周邊，近距離欣賞壯麗的山景與湖光山色。
        </p>

        <!-- 景點 1 -->
        <div class="spot-card">
            <img src="IMAGE/河口湖.jpg" alt="河口湖">
            <div class="spot-text">
                <h3>河口湖</h3>
                <p>富士五湖中最受歡迎的觀光勝地，天氣晴朗且無風時，湖面上會倒映出清晰對稱的「逆富士」絕景，周邊也有許多景觀咖啡廳與纜車設施。</p>
            </div>
        </div>

        <!-- 旅遊照片紀錄區 -->
        <section class="photo-section">
            <h2>旅遊照片紀錄</h2>
            <div class="photo-grid">
                <img src="IMAGE/富士山一.jpg" alt="富士山照片1">
                <img src="IMAGE/富士山二.jpg" alt="富士山照片2">
                <img src="IMAGE/富士山三.jpg" alt="富士山照片3">
            </div>
        </section>
    </main>

</body>
</html>
